<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/lantern_spirit/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lantern Spirit, a glowing companion living in a park app, built with Flutter Scene.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lantern Spirit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lantern Spirit</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #070A15; }
    body { display: flex; align-items: center; justify-content: center; }
    /* A phone screen: fills a phone, stays phone-sized on a wide window. */
    #app { position: relative; width: min(430px, 100vw); height: min(932px, 100vh); overflow: hidden; }
    @media (min-width: 600px) and (min-height: 600px) {
      #app { height: min(932px, 100vh - 48px); border-radius: 28px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6); }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="app"></div>
  <!-- SoLoud's web audio module (flutter_soloud). -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
